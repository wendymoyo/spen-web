serenity.project.name=SPEN Cucumber BDD Project
webdriver.base.url=https://devccp.spenergynetworks.co.uk
#webdriver.base.url=http://testccp.spenergynetworks.co.uk
#webdriver.base.url=https://ccp.spenergynetworks.co.uk/
webdriver.timeouts.implicitlywait=5000
webdriver.wait.for.timeout=10000
webdriver.driver=edge
headless.mode=true
serenity.browser.maximized=true
drivers.windows.webdriver.edge.driver=src/test/resources/drivers/windows/msedgedriver.exe
drivers.windows.webdriver.gecko.driver=src/test/resources/drivers/windows/geckodriver.exe
drivers.windows.webdriver.chrome.driver=src/test/resources/drivers/windows/chromedriver.exe
drivers.windows.webdriver.opera.driver=src/test/resources/drivers/windows/operadriver.exe
#drivers.mac.webdriver.chrome.driver=src/test/resources/drivers/mac/chromedriver
chrome.switches=--disable-extensions;--user-agent=New User Agent
serenity.take.screenshots=AFTER_EACH_STEP
